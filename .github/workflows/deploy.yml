name: Refresh data and deploy site

on:
  schedule:
    # Every 6 hours (00:17, 06:17, 12:17, 18:17 UTC) -- was every 4 hours
    # (see below for why that was bumped from once daily), but the math
    # didn't leave any real headroom: SGO's free tier is 2,500 objects/
    # month, billed per event returned (~16 objects for a full week's
    # fetch -- see build_stats.py's SGO_EVENTS_URL comment), and 4-hour
    # cron alone is 180 builds/month * ~16 = ~2,880/month -- already over
    # budget before a single manual rebuild. Confirmed directly: a day with
    # more manual rebuilds than usual hit HTTP 429 (quota exceeded) and
    # wiped every team's Anytime TD odds (see fetch_previous_odds_snapshot
    # for the fallback added alongside this so a future quota hit degrades
    # instead of zeroing everything out). 6-hour cron is 120 builds/month *
    # ~16 = ~1,920/month, leaving real room for on-demand pushes.
    #
    # Original 4-hour reasoning, still true, just no longer worth the
    # quota cost: nflverse's own games.csv (the free odds source
    # build_stats.py reads from -- no live feed involved) gets re-scraped
    # several times a day, not just once, so a full day's gap meant this
    # site could sit noticeably behind the real market even right after a
    # rebuild. This still narrows the average gap well below a full day --
    # it can't do better than nflverse's OWN refresh rate no matter how
    # often this polls, so if a line still looks off right after a run,
    # nflverse just hasn't re-scraped it yet, not a bug here.
    # Offset 17 minutes past the hour on purpose -- GitHub's own docs warn
    # that on-the-hour schedules are the most likely to be delayed/dropped
    # during peak Actions load, and that's exactly what happened here
    # (confirmed: only one scheduled run ever fired, 4+ hours late, and a
    # whole day was missed outright) -- a few minutes off the hour avoids
    # the worst of that contention.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button, for on-demand refresh
  push:
    branches: [main]
    paths:
      - "nfl_tool/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r nfl_tool/requirements.txt

      - name: Build stats (nflverse needs no key; SGO_API_KEY is optional)
        # NOTE: bump the --season each year once the new season's data
        # exists on nflverse (typically as soon as Week 1 games are played).
        # SGO_API_KEY is optional -- player anytime-TD odds just don't
        # populate without it, everything else works the same.
        # SGO_API_KEY_BACKUP is also optional -- a second SGO account's key,
        # tried automatically if the primary key's quota runs out mid-month
        # (see fetch_sgo_events). Add it as its own repository secret
        # (Settings -> Secrets and variables -> Actions) with this exact
        # name; nothing else needs to change for it to start being used.
        # SKIP_SGO_FETCH only on the "push" trigger -- a routine code/UI
        # push doesn't need fresh odds, and every one used to spend real
        # SGO quota for nothing (confirmed: this is what burned a whole
        # month's budget in one active day). The schedule (every 6 hours)
        # and a manual "Run workflow" -- the site's actual "UPDATE ODDS"
        # button, see the topbar link -- still fetch fresh every time.
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SGO_API_KEY_BACKUP: ${{ secrets.SGO_API_KEY_BACKUP }}
          SKIP_SGO_FETCH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python nfl_tool/build_stats.py --season 2026 --out nfl_tool/site/data.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nfl_tool/site

      - id: deployment
        uses: actions/deploy-pages@v4
