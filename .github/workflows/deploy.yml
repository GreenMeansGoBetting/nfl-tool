name: Refresh data and deploy site

on:
  schedule:
    # Every 6 hours (00:17, 06:17, 12:17, 18:17 UTC) -- was every 4 hours
    # (see below for why that was bumped from once daily), but the math
    # didn't leave any real headroom: SGO's free tier is 2,500 objects/
    # month, billed per event returned (~16 objects for a full week's
    # fetch -- see build_stats.py's SGO_EVENTS_URL comment), and 4-hour
    # cron alone is 180 builds/month * ~16 = ~2,880/month -- already over
    # budget before a single manual rebuild. Confirmed directly: a day with
    # more manual rebuilds than usual hit HTTP 429 (quota exceeded) and
    # wiped every team's Anytime TD odds (see fetch_previous_odds_snapshot
    # for the fallback added alongside this so a future quota hit degrades
    # instead of zeroing everything out). 6-hour cron is 120 builds/month *
    # ~16 = ~1,920/month, leaving real room for on-demand pushes.
    #
    # Original 4-hour reasoning, still true, just no longer worth the
    # quota cost: nflverse's own games.csv (the free odds source
    # build_stats.py reads from -- no live feed involved) gets re-scraped
    # several times a day, not just once, so a full day's gap meant this
    # site could sit noticeably behind the real market even right after a
    # rebuild. This still narrows the average gap well below a full day --
    # it can't do better than nflverse's OWN refresh rate no matter how
    # often this polls, so if a line still looks off right after a run,
    # nflverse just hasn't re-scraped it yet, not a bug here.
    # Offset 17 minutes past the hour on purpose -- GitHub's own docs warn
    # that on-the-hour schedules are the most likely to be delayed/dropped
    # during peak Actions load, and that's exactly what happened here
    # (confirmed: only one scheduled run ever fired, 4+ hours late, and a
    # whole day was missed outright) -- a few minutes off the hour avoids
    # the worst of that contention.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button, for on-demand refresh
  # Every push to main runs the deploy, whatever it touched (2026-10-15).
  # The repo is public, so build minutes are free; the old "only these
  # folders" filter once left a fix to a failed deploy unpublished. A push that
  # changed only page files publishes with the live data (the fast lane, below). The bot's
  # model-record commits don't start a run (GitHub never starts one for a push
  # made with the workflow's own token).
  push:
    branches: [main]

permissions:
  # write: the build commits model_history/gmg_model.json (see that step)
  contents: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The build's own packages, plus the browser the tests and the site
      # check (the gate, further down) both drive.
      - name: Install dependencies
        run: |
          python tools/ci_steps.py mark start
          pip install -r nfl_tool/requirements.txt -r tools/requirements-dev.txt
          python -m playwright install --with-deps chromium
          python tools/ci_steps.py mark install

      # Every run does the same thing (2026-10-15): every test, all three
      # sports built fresh, every page checked. From 2026-10-13 to 10-15, while
      # the repo was private and build minutes were limited, a push rebuilt
      # and tested only the sport it changed; that needed a hand-kept list of
      # every test file's sport, and a file missing from it failed a deploy.

      # The tests (2026-10-13): every rule and past bug the suite pins (the GMG
      # model's math in the build and in the browser, the 4-point pick rule,
      # the odds lock, Novig's TD odds, two-sided matchup calls, pocket QBs,
      # the TD Summary's top-8 guard), run on saved samples in tests/ so the
      # answer never depends on this week's data. First on purpose: a failure
      # stops the run before anything is built, saved or published, so
      # members keep the last good version and GitHub emails the owner. One
      # retry, so a browser hiccup can't hold up an odds refresh.
      - name: Run the tests
        run: |
          python tools/run_tests.py || { echo "Retrying once..."; sleep 5; python tools/run_tests.py; }
          python tools/ci_steps.py mark tests

      # The page-only fast lane (2026-10-15, tools/ci_steps.py lane): a push
      # whose every changed file since the live version is a page, a test or
      # a note can't change any data, so the live data files are downloaded
      # instead of rebuilding all three sports (about 2.5 to 3 minutes push to
      # live instead of 7). The tests above and the gate below still run. If
      # the download fails, every build below runs as usual.
      - name: Choose the lane
        id: lane
        run: python tools/ci_steps.py lane

      - name: Use the live data (page-only push)
        id: live_data
        if: steps.lane.outputs.lane == 'pages'
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python tools/fetch_live_data.py --need nfl nba nhl
          python tools/ci_steps.py mark data

      - name: Build stats (nflverse needs no key; SGO_API_KEY is optional)
        if: steps.lane.outputs.lane != 'pages' || steps.live_data.outcome != 'success'
        # One retry: nflverse sometimes answers a download with a one-off 404,
        # and since every push builds football, a push about hockey could
        # otherwise fail on it.
        # NOTE: bump the --season each year once the new season's data
        # exists on nflverse (typically as soon as Week 1 games are played).
        # SGO_API_KEY is optional -- player anytime-TD odds just don't
        # populate without it, everything else works the same.
        # SGO_API_KEY_BACKUP is also optional -- a second SGO account's key,
        # tried automatically if the primary key's quota runs out mid-month
        # (see fetch_sgo_events). Add it as its own repository secret
        # (Settings -> Secrets and variables -> Actions) with this exact
        # name; nothing else needs to change for it to start being used.
        # SKIP_SGO_FETCH only on the "push" trigger -- a routine code/UI
        # push doesn't need fresh odds, and every one used to spend real
        # SGO quota for nothing (confirmed: this is what burned a whole
        # month's budget in one active day). The schedule (every 6 hours)
        # and a manual "Run workflow" -- the site's actual "UPDATE ODDS"
        # button, see the topbar link -- still fetch fresh every time.
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SGO_API_KEY_BACKUP: ${{ secrets.SGO_API_KEY_BACKUP }}
          SMARTSTAKE_API_KEY: ${{ secrets.SMARTSTAKE_API_KEY }}
          # Lets the build read the live data.json through the Discord login
          # (fetch_previous_odds_snapshot sends a key derived from it).
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SKIP_SGO_FETCH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          python nfl_tool/build_stats.py --season 2026 --out nfl_tool/site/data.json || { echo "Retrying once..."; sleep 30; python nfl_tool/build_stats.py --season 2026 --out nfl_tool/site/data.json; }
          python tools/ci_steps.py mark nfl

      # GMG NBA Suite data (site/nba/data.json). Separate script, separate
      # sources (hoopR season files + Novig NBA lines); if it fails the NFL
      # site still deploys, with the NBA data as it is live (next step).
      # Its output is kept in nba_build.log for version.json, like the NHL's.
      - name: Build NBA data
        id: build_nba
        if: steps.lane.outputs.lane != 'pages' || steps.live_data.outcome != 'success'
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -o pipefail
          python nfl_tool/nba/build_nba.py --season 2027 --out nfl_tool/site/nba/data.json 2>&1 | tee nba_build.log

      # A failed build must not publish the site without that sport's data
      # (2026-10-15): whatever it left is cleared (--replace) and the live
      # copy is put back. If even that fails the deploy carries on as before,
      # and version.json says "missing".
      - name: Put the live NBA data back (the NBA build failed)
        id: back_nba
        if: steps.build_nba.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python tools/fetch_live_data.py --only nba --need nba --replace

      # Between the full rebuilds, nhl-refresh.yml rebuilds just these NHL
      # files every hour from midday to puck drop (lineups and odds).
      # GMG NHL Suite data (site/nhl/data.json, plus shots.json for the Shots
      # page and one file per team for the player card). Hockey has no season files:
      # the build downloads each finished game from the NHL's feed once and
      # keeps it in data/nhl. This cache carries that folder from one run to
      # the next; without it a run just downloads the season so far again.
      - name: Restore saved NHL games
        if: steps.lane.outputs.lane != 'pages' || steps.live_data.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: data/nhl
          key: nhl-games-${{ github.run_id }}
          restore-keys: nhl-games-

      # Like the NBA step: if it fails the NFL site still deploys. Its output
      # is kept in nhl_build.log so a failure's last line can be shown in
      # version.json (the step after "Stamp the version").
      - name: Build NHL data
        id: build_nhl
        if: steps.lane.outputs.lane != 'pages' || steps.live_data.outcome != 'success'
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SMARTSTAKE_API_KEY: ${{ secrets.SMARTSTAKE_API_KEY }}
        run: |
          set -o pipefail
          python nfl_tool/nhl/build_nhl.py --season 2027 --out nfl_tool/site/nhl/data.json --data-dir data/nhl 2>&1 | tee nhl_build.log
          python tools/ci_steps.py mark nhl

      # Like the NBA's: the NHL files as they are live, not none.
      - name: Put the live NHL data back (the NHL build failed)
        id: back_nhl
        if: steps.build_nhl.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python tools/fetch_live_data.py --only nhl --need nhl --replace

      # Saved under a name made from the games on disk, so a run that
      # downloaded nothing new doesn't store a second copy.
      - name: Save NHL games
        if: steps.lane.outputs.lane != 'pages' || steps.live_data.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/nhl
          key: nhl-games-${{ hashFiles('data/nhl/games/**') }}

      # The GMG model's locked projections and graded picks. The build
      # rewrites this file with every game that has kicked off; committing it
      # keeps the record in the repo, so it survives even if the next build
      # can't read the live site. It only changes when a game locks or goes
      # final. Never allowed to block the deploy.
      # The NHL Shots page's graded plays are kept the same way
      # (model_history/nhl_shots/<month>.json: a game is added once, when it
      # is final), so the whole folder is added.
      - name: Save GMG model record
        if: steps.lane.outputs.lane != 'pages' || steps.live_data.outcome != 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_history
          if ! git diff --cached --quiet; then
            git commit -m "Model records: lock started games and grade finals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Which build this is, served at https://nfl.gmgsports.org/version.json
      # (public: the way to confirm a deploy without the repo's Actions page).
      - name: Stamp the version
        run: |
          printf '{"sha":"%s","run":"%s","built":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%MZ)" > nfl_tool/site/version.json

      # The gate (2026-10-13): open every page and every game's Summary cards
      # in a real browser BEFORE anything is published. A script error, a
      # missing file or a card that doesn't draw stops the run here, so
      # members keep the last good version and GitHub emails the owner. Cards
      # that are merely too full never block (site-check.yml reports those
      # after the deploy). One retry, so a hiccup can't hold up an odds refresh.
      # (Its browser is installed in the first step, for the tests.)
      - name: Check the site before it goes live
        run: |
          python tools/check_site.py --gate || { echo "Retrying once..."; sleep 5; python tools/check_site.py --gate; }
          python tools/ci_steps.py mark gate

      # Cloudflare Pages is the only host (the GitHub Pages copy was dropped
      # 2026-10-13: it served the site without the member login). The project
      # (gmg-nfl) was created by this workflow's first run; that step ran, and
      # failed with "already exists", on every run since, so it was removed
      # 2026-10-13. If the project is ever deleted, recreate it once with
      #   npx wrangler pages project create gmg-nfl --production-branch=main

      # Discord login gate secrets (nfl_tool/functions/_middleware.js):
      # copied from GitHub secrets into the Pages project (Pages picks up a
      # changed secret on the next deployment). Skipped while a secret doesn't
      # exist yet -- the gate stays off until both do. Every run, so a new
      # secret value is live with the next push, "Update Odds" or 6-hour run.
      - name: Push Discord secrets to Cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DCS: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DBT: ${{ secrets.DISCORD_BOT_TOKEN }}
          SSK: ${{ secrets.STRIPE_SECRET_KEY }}
          SWS: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$DCS" ]; then printf '%s' "$DCS" | npx -y wrangler@3 pages secret put DISCORD_CLIENT_SECRET --project-name=gmg-nfl; fi
          if [ -n "$DBT" ]; then printf '%s' "$DBT" | npx -y wrangler@3 pages secret put DISCORD_BOT_TOKEN --project-name=gmg-nfl; fi
          # Email members (Stripe; the webhook secret is optional); each skipped until it exists.
          if [ -n "$SSK" ]; then printf '%s' "$SSK" | npx -y wrangler@3 pages secret put STRIPE_SECRET_KEY --project-name=gmg-nfl; fi
          if [ -n "$SWS" ]; then printf '%s' "$SWS" | npx -y wrangler@3 pages secret put STRIPE_WEBHOOK_SECRET --project-name=gmg-nfl; fi

      # Member profiles (saved plays/picks/notes per Discord account): a D1
      # database, created on the first run, its table created if missing,
      # and bound to the Pages project as DB through a generated
      # nfl_tool/wrangler.toml (the database ID isn't secret). If any of
      # this fails the deploy still goes out, just without profiles
      # (/auth/status shows profiles:false and sync.js stays local-only).
      # Every run names the database and writes the binding (the publish
      # needs it), then makes sure every table and column exists.
      - name: Member profile database (D1)
        continue-on-error: true
        working-directory: nfl_tool
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@3 d1 list --json > d1.json || echo "[]" > d1.json
          DBID=$(jq -r '.[] | select(.name=="gmg-nfl-users") | .uuid' d1.json)
          if [ -z "$DBID" ]; then
            npx -y wrangler@3 d1 create gmg-nfl-users
            npx -y wrangler@3 d1 list --json > d1.json
            DBID=$(jq -r '.[] | select(.name=="gmg-nfl-users") | .uuid' d1.json)
          fi
          rm -f d1.json
          test -n "$DBID"
          {
            echo 'name = "gmg-nfl"'
            echo 'pages_build_output_dir = "site"'
            echo 'compatibility_date = "2024-09-01"'
            echo '[[d1_databases]]'
            echo 'binding = "DB"'
            echo 'database_name = "gmg-nfl-users"'
            echo "database_id = \"$DBID\""
          } > wrangler.toml
          npx -y wrangler@3 d1 execute gmg-nfl-users --remote --command "CREATE TABLE IF NOT EXISTS user_state (uid TEXT NOT NULL, k TEXT NOT NULL, v TEXT NOT NULL, updated INTEGER NOT NULL, PRIMARY KEY (uid, k))"
          # Email members (Stripe): live subscription status + password, one trial per card.
          npx -y wrangler@3 d1 execute gmg-nfl-users --remote --command "CREATE TABLE IF NOT EXISTS members (email TEXT PRIMARY KEY, customer TEXT, subscription TEXT, status TEXT, period_end INTEGER, trial_used INTEGER NOT NULL DEFAULT 0, manual_until INTEGER, note TEXT, updated INTEGER)"
          # Password columns (added after the table first shipped; "|| true" = already there).
          for col in "pw TEXT" "fail_count INTEGER" "lock_until INTEGER"; do
            npx -y wrangler@3 d1 execute gmg-nfl-users --remote --command "ALTER TABLE members ADD COLUMN $col" || true
          done
          npx -y wrangler@3 d1 execute gmg-nfl-users --remote --command "CREATE TABLE IF NOT EXISTS trial_cards (fingerprint TEXT PRIMARY KEY, email TEXT NOT NULL, created INTEGER)"
          # "Request a feature" ideas from members (owner reads them from the same button).
          npx -y wrangler@3 d1 execute gmg-nfl-users --remote --command "CREATE TABLE IF NOT EXISTS feature_requests (id INTEGER PRIMARY KEY AUTOINCREMENT, uid TEXT NOT NULL, name TEXT, text TEXT NOT NULL, created INTEGER NOT NULL, status TEXT NOT NULL DEFAULT 'new')"

      # Email members sign in through the database. If the step above could
      # not even name it, publishing would lock them out -- stop instead and
      # keep the last good version live.
      - name: Refuse to publish without the member database
        run: grep -q "d1_databases" nfl_tool/wrangler.toml

      # What this run did, added to version.json: whether the NBA and NHL data
      # builds worked (their data files sit behind the login), whether a
      # failed one's live copy was put back ("data": built / live copy /
      # missing), and how many seconds each stage took. Last before the
      # publish so the timings cover everything; never allowed to block the
      # deploy (version.json stays as stamped above if this step fails).
      - name: Note the run in version.json
        continue-on-error: true
        env:
          DATA_NBA: ${{ steps.build_nba.outcome == 'success' && 'built' || ((steps.back_nba.outcome == 'success' || steps.live_data.outcome == 'success') && 'live copy' || 'missing') }}
          DATA_NHL: ${{ steps.build_nhl.outcome == 'success' && 'built' || ((steps.back_nhl.outcome == 'success' || steps.live_data.outcome == 'success') && 'live copy' || 'missing') }}
          LANE: ${{ steps.lane.outputs.lane }}
        run: |
          python tools/ci_steps.py mark cloudflare
          python tools/ci_steps.py note

      # Deployed from nfl_tool/ so wrangler bundles nfl_tool/functions (the
      # login gate) alongside the static site folder. Not continue-on-error:
      # this is the only host, so a failed publish must show as a failed run.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nfl_tool
          command: pages deploy site --project-name=gmg-nfl --branch=main --commit-dirty=true

      # After the publish (2026-10-13, tools/ci_steps.py live-check): look at
      # the real site from outside. The tests and the gate only see the pages
      # before they go out; they can't see the login code, the member database
      # or a secret going wrong at the host. If the site isn't answering after
      # this publish, the version from before it is put back within about a
      # minute, with nobody needed, and the run fails so GitHub emails the owner.
      - name: Check the live site (and put the last version back if it is down)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/ci_steps.py live-check
