name: Site check

# Runs tools/check_site.py against the LIVE data once a day, so a Summary
# card that gets squeezed is caught the same day instead of when someone
# happens to look.
#
# It used to run after every deploy. Since 2026-10-13 the deploy itself opens
# every page and every Summary card before it publishes (the gate), so a page
# that BREAKS never goes live; running this after each deploy as well meant a
# second machine installing a second browser to look at the same pages, about
# 3 of the private repo's 2,000 free minutes each time. What only this check
# reports is the softer kind (a card shrunk too far, cut-off text, a page too
# wide on a phone), and once a day is enough for those. It can also be run by
# hand from the Actions page.
#
# A failed run means the check found a NEW problem. GitHub emails the repo
# owner about failed runs; the report is on the run's Summary page. If the
# secret SITE_CHECK_WEBHOOK (a Discord webhook URL) is ever added, the report
# is also posted there. The same problems are only reported once: a card that
# stays too full all week doesn't fail (and email) every day.

on:
  schedule:
    # 12:57 UTC, 40 minutes after the morning rebuild (8:57 am Eastern in
    # daylight time, 7:57 am in standard time).
    - cron: "57 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the check's tools
        run: |
          pip install -r tools/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Download the live data
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python tools/fetch_live_data.py

      # What the last run reported, so the same problems aren't reported twice.
      - uses: actions/cache/restore@v4
        with:
          path: last-problems.txt
          key: site-check-${{ github.run_id }}
          restore-keys: site-check-

      - name: Check the site
        id: check
        run: |
          set +e
          python tools/check_site.py | tee report.txt
          code=${PIPESTATUS[0]}
          grep "PROBLEM" report.txt | sort > problems.txt
          touch last-problems.txt
          if [ "$code" = "1" ] && cmp -s problems.txt last-problems.txt; then
            echo "Same problems as the last run; already reported." | tee -a report.txt
            code=0
          fi
          cp problems.txt last-problems.txt
          {
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: last-problems.txt
          key: site-check-${{ github.run_id }}

      - name: Post the report to Discord (only if a webhook is set up)
        if: ${{ failure() && steps.check.conclusion == 'failure' }}
        env:
          SITE_CHECK_WEBHOOK: ${{ secrets.SITE_CHECK_WEBHOOK }}
        run: |
          if [ -z "$SITE_CHECK_WEBHOOK" ]; then echo "No webhook set; skipping."; exit 0; fi
          python - <<'EOF'
          import json, os, urllib.request
          report = open("report.txt", encoding="utf-8").read()[:1800]
          body = json.dumps({"content": "**GMG site check found a problem**\n```\n" + report + "\n```"}).encode()
          req = urllib.request.Request(os.environ["SITE_CHECK_WEBHOOK"], data=body, headers={"content-type": "application/json", "User-Agent": "gmg-site-check"})
          urllib.request.urlopen(req, timeout=30)
          EOF
